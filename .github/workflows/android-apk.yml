name: Bike Rider Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check app icon
        run: |
          if [ ! -f assets/icon.png ]; then
            echo "ERROR: assets/icon.png not found. Upload the icon image first."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web game
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Set Android app orientation to landscape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              print(f"ERROR: Android manifest not found: {manifest}")
              sys.exit(1)

          content = manifest.read_text(encoding="utf-8")
          pattern = re.compile(
              r'<activity\b(?=[^>]*\bandroid:name="[^"]*MainActivity")[^>]*>',
              re.DOTALL
          )
          match = pattern.search(content)
          if not match:
              print("ERROR: Could not find the MainActivity entry in AndroidManifest.xml")
              sys.exit(1)

          activity_tag = match.group(0)
          if re.search(r'\bandroid:screenOrientation="[^"]*"', activity_tag):
              updated_tag = re.sub(
                  r'\bandroid:screenOrientation="[^"]*"',
                  'android:screenOrientation="landscape"',
                  activity_tag
              )
          else:
              updated_tag = activity_tag[:-1] + ' android:screenOrientation="landscape">'

          content = content[:match.start()] + updated_tag + content[match.end():]
          manifest.write_text(content, encoding="utf-8")
          print("MainActivity orientation set to landscape.")
          PY

      - name: Generate Android app icons
        run: |
          npm exec --yes --package=@capacitor/assets -- capacitor-assets generate --android

      - name: Sync game into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bike-rider-himalayan-icon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
