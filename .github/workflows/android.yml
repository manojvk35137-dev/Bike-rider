
name: Bike Rider Web Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build game
        run: npm run build

      - name: Save build output
        uses: actions/upload-artifact@v4
        with:
          name: bike-rider-web-build
          path: dist/
